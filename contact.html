<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Start Your Project | Lake Hazel Design</title>
  <meta name="description" content="Tell Lake Hazel Design a little about your project.">
  <style>
    :root{--hazel:#253439;--camel:#b29e84;--paper:#fffff9;--ink:#111;--muted:#667072;--line:#d8d2c9;--white:#fff}
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:Jost,Arial,sans-serif}
    .wrap{width:min(820px,calc(100% - 32px));margin:0 auto;padding:52px 0 72px}
    .card{background:var(--white);border:1px solid rgba(37,52,57,.14);padding:clamp(26px,6vw,58px);box-shadow:0 20px 55px rgba(37,52,57,.08)}
    .eyebrow{margin:0 0 14px;color:var(--camel);font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
    h1{margin:0;color:var(--hazel);font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(45px,8vw,72px);font-weight:500;letter-spacing:-.03em;line-height:.95}
    .intro{max-width:620px;margin:20px 0 36px;color:var(--muted);font-size:17px;line-height:1.7}
    form{display:grid;grid-template-columns:1fr 1fr;gap:22px 18px}
    .field{display:flex;flex-direction:column;gap:8px}.full{grid-column:1/-1}
    label{color:var(--hazel);font-size:13px;font-weight:700;letter-spacing:.04em}
    input,select,textarea{width:100%;border:1px solid var(--line);border-radius:0;background:#fff;color:var(--ink);font:inherit;font-size:16px;padding:14px 15px;outline:none;transition:border-color .15s,box-shadow .15s}
    input:focus,select:focus,textarea:focus{border-color:var(--camel);box-shadow:0 0 0 3px rgba(178,158,132,.18)}
    textarea{min-height:150px;resize:vertical;line-height:1.55}
    button{grid-column:1/-1;border:0;background:var(--hazel);color:#fff;cursor:pointer;font:inherit;font-size:13px;font-weight:700;letter-spacing:.14em;padding:17px 24px;text-transform:uppercase;transition:background .15s,transform .15s}
    button:hover{background:#172326;transform:translateY(-1px)}button:disabled{cursor:wait;opacity:.7;transform:none}
    .message{display:none;grid-column:1/-1;margin:0;padding:14px 16px;font-size:15px;line-height:1.5}.message.show{display:block}.success{background:#edf4ef;color:#23452e}.error{background:#fff0ee;color:#8a2d24}
    @media(max-width:640px){.wrap{width:min(100% - 20px,820px);padding:20px 0 40px}.card{padding:28px 20px}form{grid-template-columns:1fr}.field,.full,button,.message{grid-column:1}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <p class="eyebrow">Lake Hazel Design</p>
      <h1>Tell us about your project.</h1>
      <p class="intro">Share a few details below. Our team will review your inquiry and reach out with the best next step.</p>

      <form id="lead-form">
        <div class="field full">
          <label for="name">Name</label>
          <input id="name" name="name" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="phone">Phone</label>
          <input id="phone" name="phone" type="tel" autocomplete="tel" required>
        </div>
        <div class="field full">
          <label for="cityState">City / State</label>
          <input id="cityState" name="cityState" autocomplete="address-level2" placeholder="Salt Lake City, UT" required>
        </div>
        <div class="field">
          <label for="projectType">Project Type</label>
          <select id="projectType" name="projectType" required>
            <option value="" selected disabled>Select one</option>
            <option>Full-Service Interior Design</option>
            <option>Renovation / Remodel</option>
            <option>New Construction</option>
            <option>Furnishings and Styling</option>
            <option>Design Consultation</option>
            <option>Commercial Design</option>
            <option>Other</option>
          </select>
        </div>
        <div class="field">
          <label for="estimatedBudget">Estimated Budget</label>
          <select id="estimatedBudget" name="estimatedBudget" required>
            <option value="" selected disabled>Select a range</option>
            <option>Under $10,000</option>
            <option>$10,000–$25,000</option>
            <option>$25,000–$50,000</option>
            <option>$50,000–$100,000</option>
            <option>$100,000–$250,000</option>
            <option>$250,000+</option>
            <option>Not sure yet</option>
          </select>
        </div>
        <div class="field full">
          <label for="desiredStartDate">Desired Start Date</label>
          <input id="desiredStartDate" name="desiredStartDate" type="date" required>
        </div>
        <div class="field full">
          <label for="projectDetails">Briefly tell us about your project</label>
          <textarea id="projectDetails" name="projectDetails" required></textarea>
        </div>
        <div class="field full">
          <label for="leadSource">How did you hear about Lake Hazel Design?</label>
          <select id="leadSource" name="leadSource" required>
            <option value="" selected disabled>Select one</option>
            <option>Referral from a friend or client</option>
            <option>Lake Hazel Ambassador</option>
            <option>Instagram</option>
            <option>Facebook</option>
            <option>Google</option>
            <option>Networking or event</option>
            <option>Contractor or industry partner</option>
            <option>Other</option>
          </select>
        </div>
        <p id="form-message" class="message" role="status" aria-live="polite"></p>
        <button id="submit-button" type="submit">Send Project Inquiry</button>
      </form>
    </section>
  </main>

  <script>
    const form = document.getElementById('lead-form');
    const button = document.getElementById('submit-button');
    const message = document.getElementById('form-message');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      button.disabled = true;
      button.textContent = 'Sending…';
      message.className = 'message';

      const payload = Object.fromEntries(new FormData(form).entries());

      try {
        const response = await fetch('/api/lead-inquiry', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(result.error || 'Please try again.');

        form.reset();
        message.textContent = 'Thank you! Your inquiry has been sent. The Lake Hazel Design team will be in touch soon.';
        message.className = 'message success show';
      } catch (error) {
        message.textContent = error.message || 'We could not send your inquiry. Please try again.';
        message.className = 'message error show';
      } finally {
        button.disabled = false;
        button.textContent = 'Send Project Inquiry';
      }
    });
  </script>
</body>
</html>
